  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #header {
      width: 100%;
      position: absolute;
      top: 0;
      background-color: #f8f9fa;
      /* Optional: background color for the header */
      z-index: 1000;
      /* Ensure the header stays on top of other elements */
    }

    #mapElement {
      position: absolute;
      top: 0;
      /* This will be adjusted dynamically by JavaScript */
      bottom: 0;
      width: 100%;
    }

    #footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      z-index: 1;
    }

    button:disabled {
      background-color: #d3d3d3 !important;
      color: #a9a9a9 !important;
      cursor: not-allowed !important;
      opacity: 0.6 !important;
    }

    @keyframes l6 {
      0% {
        -webkit-mask-size: 0 0, 0 0, 0 0, auto
      }

      8.33% {
        -webkit-mask-size: var(--s), 0 0, 0 0, auto
      }

      16.67% {
        -webkit-mask-size: var(--s), var(--s), 0 0, auto
      }

      25%,
      50% {
        -webkit-mask-size: var(--s), var(--s), var(--s), auto
      }

      58.33% {
        -webkit-mask-size: 0 0, var(--s), var(--s), auto
      }

      66.67% {
        -webkit-mask-size: 0 0, 0 0, var(--s), auto
      }

      75%,
      100% {
        -webkit-mask-size: 0 0, 0 0, 0 0, auto
      }
    }
  </style>
